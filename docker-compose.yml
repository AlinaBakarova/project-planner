version: '3.8'

services:
  backend:
    build: ./backend
    container_name: scheduler-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - backend-data:/data
    restart: unless-stopped

volumes:
  backend-data:
